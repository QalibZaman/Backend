<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Confirm Your New Email</title>
</head>
<body>
    <p>Dear {{ first_name }},</p>
    <p>You requested to change the email address for your {{ shop_name }}.</p>
    <p>Please confirm this change by clicking the link below:</p>
    <p><a href="{{ confirmation_link }}">Confirm Email Change</a></p>
    <p>If you did not request this change, please ignore this email. Thank you!</p>
</body>
</html>
