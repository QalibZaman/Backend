<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Email verification</title>
</head>
<body>
    <p>Hi {{ user_name }},</p>
    <p>Click the link below to verify your email:</p>
    <p>
        <a href="{{activation_link}}"
           style="
       display: inline-block;
       padding: 12px 24px;
       font-size: 16px;
       color: #ffffff;
       background-color: #4F46E5;
       text-decoration: none;
       border-radius: 6px;
       font-weight: bold;
     ">
            Verify My Email
        </a>
    </p>
    <p>
        If the button above doesn�t work, copy and paste this URL into your browser:
        <br /><code>{{activation_link}}</code>
    </p>
    <p>This link is valid for {{token_expiration_hours}} hours. If you did not request this, please ignore this email.</p>
</body>
</html>
