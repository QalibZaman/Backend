stages:
  - build
  - publish

variables:
  DOTNET_VERSION: "8.0"
  AZURE_WEBAPP_NAME: "netto-dotnet"
  AZURE_RESOURCE_GROUP: "Netto_Pro_Health_RG"

before_script:
  - apt-get update -y
  - apt-get install -y wget apt-transport-https
  - wget https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
  - dpkg -i packages-microsoft-prod.deb
  - apt-get update -y
  - apt-get install -y dotnet-sdk-$DOTNET_VERSION
  - dotnet --version

build:
  stage: build
  script:
    - dotnet restore
    - dotnet build --configuration Release
    - dotnet publish --configuration Release --output ./publish

publish:
  stage: publish
  script:
    - echo "$AZURE_CREDENTIALS" | base64 -d > azureauth.json
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az webapp deployment source config-zip --resource-group $AZURE_RESOURCE_GROUP --name $AZURE_WEBAPP_NAME --src ./publish
  dependencies:
    - build
  only:
    - dev

