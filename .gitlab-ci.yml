workflow:
  name: 'Pipeline for Branch - $CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"' 
      variables:
        ASPNETCORE_ENVIRONMENT: "Development"
        APP_NAME_SUFFIX: ""
    - if: '$CI_COMMIT_BRANCH == "test"'
      variables:
        ASPNETCORE_ENVIRONMENT: "Testing"
        APP_NAME_SUFFIX: "-staging"
    - if: '$CI_COMMIT_BRANCH == "prod"'
      variables:
        ASPNETCORE_ENVIRONMENT: "Production"
        APP_NAME_SUFFIX: "-prod"
    - when: always
      variables:
        ASPNETCORE_ENVIRONMENT: "Development"
        APP_NAME_FULL: ${APP_NAME}

stages:
  - restore
  - build
  - test
  - sonarqube
  - containerization
  - migration
  - deploy

variables:
  DOCKER_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_NAME}
  BUILD_CONFIGURATION: Release
  APP_VERSION: "0.0.${CI_PIPELINE_IID}"

restore:
  stage: restore
  image: mcr.microsoft.com/dotnet/sdk:8.0
  cache:
    key: "${CI_PROJECT_NAME}-nuget"
    policy: pull-push
    paths:
      - .nuget/packages/
  script:
    - dotnet restore "NettoRetail.API/NettoRetail.API.csproj"

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  needs:
    - job: restore
  script:
    - echo "Building the application..."
    - dotnet build "NettoRetail.API/NettoRetail.API.csproj" -c $BUILD_CONFIGURATION -o build /p:VersionPrefix=1.0.0 /p:VersionSuffix=ci.${CI_COMMIT_SHORT_SHA}
    - dotnet publish "NettoRetail.API/NettoRetail.API.csproj" -c Release -r linux-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
  artifacts:
    paths:
      - build
      - publish
    expire_in: "2 days"

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  needs:
    - job: build
  cache:
    key: "nuget-tools"
    policy: pull-push
    paths:
      - .nuget/packages/
      - .dotnet/tools/
      - .local/share/NuGet/v3-cache/
  before_script:
    - dotnet tool install -g dotnet-reportgenerator-globaltool
    - export PATH="$PATH:/root/.dotnet/tools"
    - dotnet add NettoRetail.Tests package JunitXml.TestLogger
    - dotnet restore NettoRetail.Tests/NettoRetail.Tests.csproj
    - mkdir -p TestResults   
  script:
    - echo "Beginning testing process..."
    - dotnet test "NettoRetail.Tests/NettoRetail.Tests.csproj" -c $BUILD_CONFIGURATION --results-directory TestResults --logger "trx;LogFileName=test_results.trx" --collect:"XPlat Code Coverage" --logger "junit;LogFilePath=TestResults/junit.xml" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura
  artifacts:
    when: always
    expire_in: "7 days"
    paths:
      - '**/TestResults/**/test_results.trx'
      - '**/TestResults/**/coverage.*'
      - '**/TestResults/**/*.cobertura.xml'
      - '**/TestResults/junit.xml'
    reports:
      junit: '**/TestResults/junit.xml'
      coverage_report:
        coverage_format: cobertura
        path: TestResults/**/coverage.cobertura.xml
  allow_failure: true

sonarqube:
  stage: sonarqube
  image: mcr.microsoft.com/dotnet/sdk:8.0
  needs:
    - job: test
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openjdk-17-jre-headless gettext-base
    - dotnet tool install --global dotnet-sonarscanner
    - export PATH="$PATH:/root/.dotnet/tools"
    - export SONAR_KEY=$(echo 'netto-retailtech-$CI_MERGE_REQUEST_TARGET_BRANCH_NAME' | envsubst)
    - if [ -z "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then export SONAR_KEY="netto-retailtech-$CI_COMMIT_REF_SLUG"; fi
    - echo "Using SONAR_KEY=$SONAR_KEY"
    - SONAR_DASHBOARD="$SONAR_HOST_URL/dashboard?id=$SONAR_KEY"
    - echo "SONAR_DASHBOARD=$SONAR_DASHBOARD" > sonar.env
    - |
      cat > annotations.json <<EOF
      {
        "sonar": [
          { "external_link": { "label": "Open SonarQube Dashboard", "url": "${SONAR_DASHBOARD}" } }
         ]
       }
      EOF
  script:
    - echo "Sonarqube initialization..."
    - >
      dotnet-sonarscanner begin
      /k:"$SONAR_KEY"
      /n:"${SONAR_KEY}-dotnet"
      /d:sonar.host.url="$SONAR_HOST_URL"
      /d:sonar.login="$SONAR_TOKEN"
      /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
      /v:"$APP_VERSION"
      /d:sonar.qualitygate.wait=true
    - dotnet build "NettoRetail.API/NettoRetail.API.csproj" -c $BUILD_CONFIGURATION
    - dotnet-sonarscanner end /d:sonar.login="$SONAR_TOKEN"
  artifacts:
    reports:
      annotations: annotations.json
  allow_failure: true
  
containerization:
  stage: containerization
  image: $AND_DOCKER_PROXY_REGISTRY_NAME/docker:26.1.4
  needs:
    - job: build
    - job: test
    - job: sonarqube
  services:
    - docker:26.1.4-dind
  before_script:
    - echo ${CI_REGISTRY_PASSWORD} | docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin
  script:
    - echo "Building Docker image..."
    - docker build -t ${DOCKER_IMAGE}:${CI_PIPELINE_ID} .
    - echo "Pushing Docker image..."
    - docker push ${DOCKER_IMAGE}:${CI_PIPELINE_ID}
    - echo "Cleaning up local Docker images..."
    - docker rmi ${DOCKER_IMAGE}:${CI_PIPELINE_ID}

migration:
  stage: migration
  image: mcr.microsoft.com/dotnet/sdk:8.0
  needs:
    - job: build
      artifacts: true
  before_script:
    - dotnet tool install --global dotnet-ef
    - export PATH="$PATH:/root/.dotnet/tools"
  script:
    - echo "Starting the Database migration..."
    - dotnet ef database update --project NettoRetail.DataAccess --startup-project NettoRetail.API -- --environment "$ASPNETCORE_ENVIRONMENT"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|test|prod)$/'
    - when: manual
      allow_failure: true
        
deploy:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  needs:
    - job: containerization
  before_script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
  script:
    - echo "Deploying Docker image to Azure Web App..."
    - APP_NAME_FULL="${APP_NAME}${APP_NAME_SUFFIX}"
    - az webapp config container set
          --name ${APP_NAME_FULL}
          --resource-group ${RESOURCE_GROUP}
          --container-image-name ${CI_REGISTRY}/${CI_PROJECT_NAME}:${CI_PIPELINE_ID}
          --container-registry-url https://${CI_REGISTRY}
          --settings ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|test|prod)$/'
    - when: never
